[workspace]
members = [
  "crates/rjest-cli",
  "crates/rjest-config",
  "crates/rjest-core",
  "crates/rjest-coverage",
  "crates/rjest-discovery",
  "crates/rjest-runner",
  "crates/rjest-snapshot",
  "crates/rjest-watch",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/OthmaneBlial/rjest"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
natord = "1.0"
notify = "8.2"
rayon = "1.11"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha1 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
